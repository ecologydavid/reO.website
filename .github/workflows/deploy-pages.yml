name: Build for Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The 800px copies of photos made by earlier builds (tools/images.mjs); only new photos are resized.
      - uses: actions/cache@v4
        with:
          path: .cache/images
          key: images-${{ github.run_id }}
          restore-keys: images-
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || 'G-7Y9HMHX23V' }}
          BASE_PATH: /
          SITE_URL: https://www.re-o.co
      - name: Publish static site to cloudflare-dist
        working-directory: dist
        run: |
          test -s sitemap.xml
          test -s index.html
          git init -q -b cloudflare-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" cloudflare-dist
