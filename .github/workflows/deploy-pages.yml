# Builds the site on every push to main and publishes it to the gh-pages branch, which GitHub Pages
# serves at https://<owner>.github.io/<repo>/. Pages is set to "Deploy from a branch: gh-pages".
# (The Actions-artifact route needs Pages switched to "GitHub Actions" in Settings first, which the
# workflow token cannot do, so publishing goes through the branch instead.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Project sites live under /<repo>/; a <user>.github.io repository is served from the root.
      - run: pnpm build
        env:
          BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
      # Replace gh-pages with this build (one commit, no history to grow). .nojekyll serves files as-is.
      - name: Publish dist to gh-pages
        working-directory: dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
